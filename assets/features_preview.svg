<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Glass Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="grad-indigo-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="grad-emerald-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <style>
    .f-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #f8fafc; font-size: 15px; }
    .f-card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 13px; }
    .f-desc { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 11px; line-height: 1.4; }
    .f-pill { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 10px; }
  </style>

  <!-- Background -->
  <rect width="960" height="380" rx="16" fill="url(#bg-feat)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect x="24" y="20" width="912" height="40" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="40" y="45" class="f-title">🚀 Enterprise Intelligence Suite Capabilities (v3.1.0)</text>

  <!-- 4 Feature Cards Grid -->
  
  <!-- Card 1: 9 Export Formats -->
  <g transform="translate(24, 76)">
    <rect width="444" height="134" rx="12" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="url(#grad-indigo-purple)" />
    <text x="34" y="39" font-size="18" text-anchor="middle">📊</text>
    <text x="64" y="32" class="f-card-title">9 Multi-Format Export Engines</text>
    <text x="64" y="48" class="f-desc">Export project analysis as Markdown, JSON, HTML, SVG, Mermaid, CSV, TSV, XML, YAML, PlantUML.</text>
    
    <g transform="translate(16, 85)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="35" y="15" class="f-pill" text-anchor="middle">.md / .json</text>

      <rect x="78" y="0" width="70" height="22" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
      <text x="113" y="15" class="f-pill" text-anchor="middle">.html / .svg</text>

      <rect x="156" y="0" width="70" height="22" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="191" y="15" class="f-pill" text-anchor="middle">.csv / .tsv</text>

      <rect x="234" y="0" width="70" height="22" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="269" y="15" class="f-pill" text-anchor="middle">.xml / .yaml</text>

      <rect x="312" y="0" width="90" height="22" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
      <text x="357" y="15" class="f-pill" text-anchor="middle">PlantUML / MMD</text>
    </g>
  </g>

  <!-- Card 2: ZIP Analysis Bundles -->
  <g transform="translate(492, 76)">
    <rect width="444" height="134" rx="12" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="url(#grad-cyan-blue)" />
    <text x="34" y="39" font-size="18" text-anchor="middle">📦</text>
    <text x="64" y="32" class="f-card-title">ZIP Analysis Bundling System (--bundle)</text>
    <text x="64" y="48" class="f-desc">Compile complete project intelligence reports into a single self-contained project-analysis.zip archive.</text>

    <g transform="translate(16, 85)">
      <rect x="0" y="0" width="120" height="22" rx="6" fill="#0369a1" />
      <text x="60" y="15" class="f-pill" text-anchor="middle">npx ptree --bundle</text>

      <rect x="130" y="0" width="130" height="22" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="195" y="15" class="f-pill" text-anchor="middle">--export html,json,ai</text>

      <rect x="270" y="0" width="140" height="22" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="340" y="15" class="f-pill" text-anchor="middle">project-analysis.zip</text>
    </g>
  </g>

  <!-- Card 3: AI Prompt & Context Engine -->
  <g transform="translate(24, 226)">
    <rect width="444" height="134" rx="12" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="url(#grad-emerald-teal)" />
    <text x="34" y="39" font-size="18" text-anchor="middle">🤖</text>
    <text x="64" y="32" class="f-card-title">AI Prompt &amp; Context Generator (--ai)</text>
    <text x="64" y="48" class="f-desc">Optimized context mapping for LLMs (Cursor, Claude 3.5, ChatGPT, Gemini) with token counting.</text>

    <g transform="translate(16, 85)">
      <rect x="0" y="0" width="110" height="22" rx="6" fill="#059669" />
      <text x="55" y="15" class="f-pill" text-anchor="middle">npx ptree --ai</text>

      <rect x="120" y="0" width="130" height="22" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="185" y="15" class="f-pill" text-anchor="middle">Cursor / LLM Prompt</text>

      <rect x="260" y="0" width="150" height="22" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="335" y="15" class="f-pill" text-anchor="middle">Token Count &amp; Cost Est.</text>
    </g>
  </g>

  <!-- Card 4: Duplicate Detector & Themes -->
  <g transform="translate(492, 226)">
    <rect width="444" height="134" rx="12" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="url(#grad-amber-orange)" />
    <text x="34" y="39" font-size="18" text-anchor="middle">🔎</text>
    <text x="64" y="32" class="f-card-title">Duplicate Detector &amp; Theme Engine</text>
    <text x="64" y="48" class="f-desc">Detect duplicate files by name/hash + 12 customizable tree themes &amp; 100+ icon mappings.</text>

    <g transform="translate(16, 85)">
      <rect x="0" y="0" width="130" height="22" rx="6" fill="#d97706" />
      <text x="65" y="15" class="f-pill" text-anchor="middle">--duplicates --hash</text>

      <rect x="140" y="0" width="120" height="22" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <text x="200" y="15" class="f-pill" text-anchor="middle">12 Theme Presets</text>

      <rect x="270" y="0" width="140" height="22" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1" />
      <text x="340" y="15" class="f-pill" text-anchor="middle">100+ Icon Mappings</text>
    </g>
  </g>
</svg>
