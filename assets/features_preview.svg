<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Card Glass Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>

    <linearGradient id="border-glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-glow-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-glow-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-glow-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradient Icons -->
    <linearGradient id="grad-indigo-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="grad-emerald-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes floatLight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .f-title { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; fill: #f8fafc; font-size: 15px; letter-spacing: 0.3px; }
    .f-card-title { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; fill: #ffffff; font-size: 13.5px; }
    .f-desc { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; fill: #94a3b8; font-size: 11px; line-height: 1.45; }
    .f-pill { font-family: JetBrains Mono, Consolas, monospace; font-weight: 600; fill: #ffffff; font-size: 10px; }
    .pulse-badge { animation: pulseGlow 3s ease-in-out infinite; }
    .card-hover { animation: floatLight 4s ease-in-out infinite; }
  </style>

  <!-- Outer Container -->
  <rect width="960" height="420" rx="16" fill="url(#bg-feat)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Glow Ambient Lines -->
  <line x1="24" y1="70" x2="936" y2="70" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  
  <!-- Header Bar -->
  <g transform="translate(24, 18)">
    <rect width="912" height="42" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="21" r="5" fill="#f87171" />
    <circle cx="40" cy="21" r="5" fill="#fbbf24" />
    <circle cx="56" cy="21" r="5" fill="#34d399" />
    <text x="76" y="26" class="f-title">🚀 Enterprise Codebase Intelligence &amp; Visualization Suite</text>
    
    <!-- Version Tag -->
    <rect x="800" y="10" width="96" height="22" rx="11" fill="url(#grad-indigo-purple)" class="pulse-badge" />
    <text x="848" y="25" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">LIVE</text>
  </g>

  <!-- 4 Feature Cards Grid -->

  <!-- Card 1: 2D/3D Code Graph & Vector SVG -->
  <g transform="translate(24, 78)">
    <rect width="444" height="152" rx="12" fill="url(#glass-card)" stroke="url(#border-glow-1)" stroke-width="1.25" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#grad-cyan-blue)" />
    <text x="35" y="41" font-size="20" text-anchor="middle">🎨</text>
    <text x="66" y="32" class="f-card-title">2D/3D Code Graph &amp; Vector SVG Exporter</text>
    <text x="66" y="50" class="f-desc">Interactive Canvas 2D DAG/Force/Radial layouts + WebGL 3D billboards. Vector SVG export for all layouts.</text>

    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="125" height="24" rx="6" fill="#0284c7" />
      <text x="62" y="16" class="f-pill" text-anchor="middle">--visualize</text>

      <rect x="133" y="0" width="135" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="200" y="16" class="f-pill" text-anchor="middle">📷 PNG / 🎨 SVG</text>

      <rect x="276" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="344" y="16" class="f-pill" text-anchor="middle">🌐 WebGL 3D Spheres</text>
    </g>
  </g>

  <!-- Card 2: Interactive Mind Map Engine -->
  <g transform="translate(492, 78)">
    <rect width="444" height="152" rx="12" fill="url(#glass-card)" stroke="url(#border-glow-2)" stroke-width="1.25" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#grad-indigo-purple)" />
    <text x="35" y="41" font-size="20" text-anchor="middle">🧠</text>
    <text x="66" y="32" class="f-card-title">Interactive Mind Map Engine (--mindmap)</text>
    <text x="66" y="50" class="f-desc">Horizontal node-based mind map generator with curved Bezier connectors, collapsible nodes &amp; touch controls.</text>

    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="125" height="24" rx="6" fill="#7c3aed" />
      <text x="62" y="16" class="f-pill" text-anchor="middle">--mindmap</text>

      <rect x="133" y="0" width="135" height="24" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="200" y="16" class="f-pill" text-anchor="middle">Bezier Connectors</text>

      <rect x="276" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
      <text x="344" y="16" class="f-pill" text-anchor="middle">Item Count Badges</text>
    </g>
  </g>

  <!-- Card 3: AI Prompt & Token Estimator -->
  <g transform="translate(24, 248)">
    <rect width="444" height="152" rx="12" fill="url(#glass-card)" stroke="url(#border-glow-3)" stroke-width="1.25" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#grad-emerald-teal)" />
    <text x="35" y="41" font-size="20" text-anchor="middle">🤖</text>
    <text x="66" y="32" class="f-card-title">AI Prompt &amp; Context Engine (--ai)</text>
    <text x="66" y="50" class="f-desc">Optimized context mapping for LLMs (Cursor, Claude 3.5, ChatGPT, Gemini) with exact token &amp; cost estimation.</text>

    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#059669" />
      <text x="55" y="16" class="f-pill" text-anchor="middle">--ai</text>

      <rect x="118" y="0" width="135" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="185" y="16" class="f-pill" text-anchor="middle">Cursor / LLM Prompt</text>

      <rect x="261" y="0" width="151" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="336" y="16" class="f-pill" text-anchor="middle">Token Count &amp; Cost Est.</text>
    </g>
  </g>

  <!-- Card 4: 9 Export Formats & Architecture Flow -->
  <g transform="translate(492, 248)">
    <rect width="444" height="152" rx="12" fill="url(#glass-card)" stroke="url(#border-glow-4)" stroke-width="1.25" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="url(#grad-amber-orange)" />
    <text x="35" y="41" font-size="20" text-anchor="middle">🏗️</text>
    <text x="66" y="32" class="f-card-title">Architecture Flow &amp; 9 Export Engines</text>
    <text x="66" y="50" class="f-desc">Entry point detection, role badges (Route/Controller/Service) + 9 formats (Markdown, JSON, HTML, SVG, PlantUML).</text>

    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="125" height="24" rx="6" fill="#d97706" />
      <text x="62" y="16" class="f-pill" text-anchor="middle">--flow / --export-all</text>

      <rect x="133" y="0" width="135" height="24" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <text x="200" y="16" class="f-pill" text-anchor="middle">Role Detection</text>

      <rect x="276" y="0" width="136" height="24" rx="6" fill="#1e293b" stroke="#ea580c" stroke-width="1" />
      <text x="344" y="16" class="f-pill" text-anchor="middle">9 Export Engines</text>
    </g>
  </g>
</svg>
