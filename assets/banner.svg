<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#30363d" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Decorative circles (subtle) -->
  <circle cx="100" cy="80" r="120" fill="#58a6ff" opacity="0.03"/>
  <circle cx="1100" cy="320" r="150" fill="#bc8cff" opacity="0.03"/>
  <circle cx="600" cy="200" r="250" fill="#58a6ff" opacity="0.02"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Tree Icon -->
  <text x="600" y="115" text-anchor="middle" font-size="52" fill="#58a6ff" filter="url(#glow)">🌳</text>

  <!-- Main Title -->
  <text x="600" y="175" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="800" fill="#e6edf3" letter-spacing="-1">project-tree-md</text>

  <!-- Divider line -->
  <rect x="350" y="195" width="500" height="1" fill="url(#line)"/>

  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8b949e" font-weight="400" letter-spacing="1">2D &amp; 3D Interactive Code Architecture Visualizer &amp; AI Context Generator</text>

  <!-- Badge Row -->
  <!-- Badge 1: Zero Dependencies -->
  <rect x="195" y="262" width="160" height="30" rx="15" fill="#238636" opacity="0.2"/>
  <rect x="195" y="262" width="160" height="30" rx="15" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
  <text x="275" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3fb950" font-weight="600">⚡ Zero Dependencies</text>

  <!-- Badge 2: 20+ Languages -->
  <rect x="375" y="262" width="145" height="30" rx="15" fill="#1f6feb" opacity="0.2"/>
  <rect x="375" y="262" width="145" height="30" rx="15" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <text x="447" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#58a6ff" font-weight="600">🌐 20+ Languages</text>

  <!-- Badge 3: AI-Ready -->
  <rect x="540" y="262" width="120" height="30" rx="15" fill="#8957e5" opacity="0.2"/>
  <rect x="540" y="262" width="120" height="30" rx="15" fill="none" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
  <text x="600" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#bc8cff" font-weight="600">🤖 AI-Ready</text>

  <!-- Badge 4: 2D & 3D Graphs -->
  <rect x="680" y="262" width="145" height="30" rx="15" fill="#da3633" opacity="0.15"/>
  <rect x="680" y="262" width="145" height="30" rx="15" fill="none" stroke="#f97583" stroke-width="1" opacity="0.5"/>
  <text x="752" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f97583" font-weight="600">🎨 2D &amp; 3D Graphs</text>

  <!-- Badge 5: 1-Second Analysis -->
  <rect x="845" y="262" width="160" height="30" rx="15" fill="#9e6a03" opacity="0.2"/>
  <rect x="845" y="262" width="160" height="30" rx="15" fill="none" stroke="#e3b341" stroke-width="1" opacity="0.5"/>
  <text x="925" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#e3b341" font-weight="600">⏱️ 1-Second Analysis</text>

  <!-- Command showcase -->
  <rect x="350" y="318" width="500" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="370" y="344" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="16" fill="#8b949e">$</text>
  <text x="390" y="344" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="16" fill="#79c0ff">npx ptree --visualize</text>

  <!-- Bottom accent line -->
  <rect x="0" y="397" width="1200" height="3" fill="url(#accent)"/>
</svg>
