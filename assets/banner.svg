<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-title" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="420" fill="url(#dots)" rx="16"/>

  <!-- Glowing Background Orbs -->
  <circle cx="600" cy="140" r="160" fill="#6366f1" opacity="0.1" filter="url(#glow-title)"/>
  <circle cx="300" cy="240" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow-title)"/>
  <circle cx="900" cy="240" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow-title)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Tree Icon -->
  <text x="600" y="105" text-anchor="middle" font-size="54" filter="url(#glow-title)">🌳</text>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#f8fafc" letter-spacing="-1">project-tree-md <tspan fill="#a855f7">v3.1</tspan></text>

  <!-- Divider Line -->
  <rect x="300" y="185" width="600" height="1.5" fill="url(#line)"/>

  <!-- Tagline -->
  <text x="600" y="218" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="500" letter-spacing="0.5">Enterprise Project Intelligence • Interactive Mind Maps • 2D/3D Code Architecture Graphs</text>

  <!-- Centered Badges Row (5 Badges Centered Around X=600) -->
  <!-- Badge 1: Zero Dependencies -->
  <g transform="translate(125, 248)">
    <rect width="165" height="32" rx="16" fill="#064e3b" opacity="0.4"/>
    <rect width="165" height="32" rx="16" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <text x="82.5" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#34d399" font-weight="700">⚡ Zero Dependencies</text>
  </g>

  <!-- Badge 2: Interactive MindMaps -->
  <g transform="translate(305, 248)">
    <rect width="185" height="32" rx="16" fill="#2e1065" opacity="0.4"/>
    <rect width="185" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="92.5" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#c4b5fd" font-weight="700">🧠 Interactive MindMaps</text>
  </g>

  <!-- Badge 3: 2D & 3D Graphs -->
  <g transform="translate(505, 248)">
    <rect width="165" height="32" rx="16" fill="#1e1b4b" opacity="0.4"/>
    <rect width="165" height="32" rx="16" fill="none" stroke="#818cf8" stroke-width="1.2"/>
    <text x="82.5" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#a5b4fc" font-weight="700">🎨 2D &amp; 3D Graphs</text>
  </g>

  <!-- Badge 4: 9 Export Formats -->
  <g transform="translate(685, 248)">
    <rect width="160" height="32" rx="16" fill="#083344" opacity="0.4"/>
    <rect width="160" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="80" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#7dd3fc" font-weight="700">📊 9 Export Formats</text>
  </g>

  <!-- Badge 5: AI-Ready Context -->
  <g transform="translate(860, 248)">
    <rect width="155" height="32" rx="16" fill="#451a03" opacity="0.4"/>
    <rect width="155" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="77.5" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#fde047" font-weight="700">🤖 AI-Ready Context</text>
  </g>

  <!-- Command Showcase Box (Perfectly Centered at X=600) -->
  <g transform="translate(380, 312)">
    <rect width="440" height="46" rx="10" fill="#0f172a" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" filter="url(#glow-subtle)"/>
    <text x="220" y="28" text-anchor="middle" font-family="'Fira Code', 'Consolas', monospace" font-size="16" font-weight="700">
      <tspan fill="#64748b">$ </tspan>
      <tspan fill="#818cf8">npx </tspan>
      <tspan fill="#38bdf8">project-tree-md</tspan>
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accent)"/>
</svg>
